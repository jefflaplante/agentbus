<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/><stop offset="1" stop-color="#16213a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2dd4bf" stop-opacity="0.35"/><stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1920" height="1080" fill="url(#bg)"/>
  <circle cx="960" cy="420" r="300" fill="url(#glow)"/>
  <!-- bus: a hub with three spokes -->
  <g stroke="#2dd4bf" stroke-width="6" stroke-linecap="round" fill="none" opacity="0.9">
    <line x1="960" y1="420" x2="760" y2="300"/><line x1="960" y1="420" x2="1160" y2="300"/>
    <line x1="960" y1="420" x2="960" y2="600"/>
  </g>
  <circle cx="960" cy="420" r="62" fill="#0f172a" stroke="#2dd4bf" stroke-width="6"/>
  <text x="960" y="434" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial" font-weight="700"
        font-size="36" fill="#e2e8f0">bus</text>
  <g font-family="Helvetica Neue, Helvetica, Arial" font-size="26" fill="#e2e8f0" text-anchor="middle">
    <circle cx="760" cy="300" r="44" fill="#1e293b" stroke="#a78bfa" stroke-width="4"/><text x="760" y="309">you</text>
    <circle cx="1160" cy="300" r="44" fill="#1e293b" stroke="#a78bfa" stroke-width="4"/><text x="1160" y="309">claude</text>
    <circle cx="960" cy="600" r="44" fill="#1e293b" stroke="#f59e0b" stroke-width="4"/><text x="960" y="609">☁ wx</text>
  </g>
  <text x="960" y="780" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial" font-weight="700"
        font-size="84" fill="#f8fafc">agentbus</text>
  <text x="960" y="850" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial" font-size="38"
        fill="#94a3b8">A broker, a custom agent, and Claude Code</text>
  <text x="960" y="1000" text-anchor="middle" font-family="SF Mono, Menlo, monospace" font-size="24"
        fill="#64748b">github.com/jefflaplante/agentbus · labs/</text>
</svg>
