<text x="24.6" y="57.0" fill="#FFFFFF" font-weight="bold" textLength="146.2" lengthAdjust="spacingAndGlyphs">agentbus · config</text>
<rect x="170.8" y="44.0" width="8.6" height="18" fill="#9F86FF"/>
<text x="188.0" y="57.0" fill="#E4E4E4" textLength="258.0" lengthAdjust="spacingAndGlyphs">~/.config/agentbus/broker.json</text>
<text x="446.0" y="57.0" fill="#6C6C6C" textLength="412.8" lengthAdjust="spacingAndGlyphs">  5 agents · saved on every change, applied live</text>
<text x="24.6" y="75.0" fill="#9F86FF" font-weight="bold" textLength="8.6" lengthAdjust="spacingAndGlyphs">A</text>
<text x="33.2" y="75.0" fill="#9F86FF" font-weight="bold" textLength="8.6" lengthAdjust="spacingAndGlyphs">g</text>
<text x="41.8" y="75.0" fill="#9F86FF" font-weight="bold" textLength="8.6" lengthAdjust="spacingAndGlyphs">e</text>
<text x="50.4" y="75.0" fill="#9F86FF" font-weight="bold" textLength="8.6" lengthAdjust="spacingAndGlyphs">n</text>
<text x="59.0" y="75.0" fill="#9F86FF" font-weight="bold" textLength="8.6" lengthAdjust="spacingAndGlyphs">t</text>
<text x="67.6" y="75.0" fill="#9F86FF" font-weight="bold" textLength="8.6" lengthAdjust="spacingAndGlyphs">s</text>
<text x="102.0" y="75.0" fill="#6C6C6C" textLength="129.0" lengthAdjust="spacingAndGlyphs">Broker settings</text>
<text x="16.0" y="111.0" fill="#9F86FF" font-weight="bold" textLength="111.8" lengthAdjust="spacingAndGlyphs">Set up worker</text>
<text x="145.0" y="111.0" fill="#3DD68C" font-weight="bold" textLength="404.2" lengthAdjust="spacingAndGlyphs">token in ~/.config/agentbus/tokens/worker.token</text>
<text x="24.6" y="147.0" fill="#9F86FF" font-weight="bold" textLength="8.6" lengthAdjust="spacingAndGlyphs">S</text>
<text x="33.2" y="147.0" fill="#9F86FF" font-weight="bold" textLength="8.6" lengthAdjust="spacingAndGlyphs">t</text>
<text x="41.8" y="147.0" fill="#9F86FF" font-weight="bold" textLength="8.6" lengthAdjust="spacingAndGlyphs">a</text>
<text x="50.4" y="147.0" fill="#9F86FF" font-weight="bold" textLength="8.6" lengthAdjust="spacingAndGlyphs">r</text>
<text x="59.0" y="147.0" fill="#9F86FF" font-weight="bold" textLength="8.6" lengthAdjust="spacingAndGlyphs">t</text>
<text x="93.4" y="147.0" fill="#6C6C6C" textLength="43.0" lengthAdjust="spacingAndGlyphs">Shell</text>
<text x="162.2" y="147.0" fill="#6C6C6C" textLength="17.2" lengthAdjust="spacingAndGlyphs">Go</text>
<text x="205.2" y="147.0" fill="#6C6C6C" textLength="180.6" lengthAdjust="spacingAndGlyphs">MQTT Explorer / MQTTX</text>
<text x="24.6" y="183.0" fill="#9F86FF" font-weight="bold" textLength="86.0" lengthAdjust="spacingAndGlyphs">Token file</text>
<text x="24.6" y="201.0" fill="#6C6C6C" textLength="344.0" lengthAdjust="spacingAndGlyphs">  ~/.config/agentbus/tokens/worker.token</text>
<text x="24.6" y="219.0" fill="#6C6C6C" textLength="636.4" lengthAdjust="spacingAndGlyphs">  Readable only by you (mode 0600). Clients read the token from this file;</text>
<text x="24.6" y="237.0" fill="#6C6C6C" textLength="438.6" lengthAdjust="spacingAndGlyphs">  it is never printed. Keep it out of git and chat.</text>
<text x="24.6" y="273.0" fill="#9F86FF" font-weight="bold" textLength="206.4" lengthAdjust="spacingAndGlyphs">Start it on this machine</text>
<text x="24.6" y="291.0" fill="#E4E4E4" textLength="584.8" lengthAdjust="spacingAndGlyphs">  agentbus --agent worker handle --capability textstats --exec &#39;CMD&#39;</text>
<text x="24.6" y="309.0" fill="#6C6C6C" textLength="602.0" lengthAdjust="spacingAndGlyphs">      take its textstats tasks; CMD is your program, run once per task</text>
<text x="24.6" y="327.0" fill="#E4E4E4" textLength="387.0" lengthAdjust="spacingAndGlyphs">  agentbus --agent worker handle --exec &#39;CMD&#39;</text>
<text x="24.6" y="345.0" fill="#6C6C6C" textLength="541.8" lengthAdjust="spacingAndGlyphs">      answer requests sent to worker; CMD runs once per request</text>
<text x="24.6" y="363.0" fill="#E4E4E4" textLength="275.2" lengthAdjust="spacingAndGlyphs">  agentbus --agent worker listen</text>
<text x="24.6" y="381.0" fill="#6C6C6C" textLength="430.0" lengthAdjust="spacingAndGlyphs">      print messages sent to worker as they arrive</text>
<text x="24.6" y="399.0" fill="#E4E4E4" textLength="481.6" lengthAdjust="spacingAndGlyphs">  agentbus --agent worker request --to AGENT --body &#39;{}&#39;</text>
<text x="24.6" y="417.0" fill="#6C6C6C" textLength="430.0" lengthAdjust="spacingAndGlyphs">      send a request as worker and print the reply</text>
<text x="24.6" y="435.0" fill="#6C6C6C" textLength="860.0" lengthAdjust="spacingAndGlyphs">  These find the broker and the token from ~/.config/agentbus/broker.json; no other settings needed.</text>
<text x="24.6" y="471.0" fill="#9F86FF" font-weight="bold" textLength="619.2" lengthAdjust="spacingAndGlyphs">Or set it for this shell, or for a program using the Go or Python client</text>
<text x="24.6" y="489.0" fill="#E4E4E4" textLength="361.2" lengthAdjust="spacingAndGlyphs">  export AGENTBUS_URL=tcp://127.0.0.1:1883</text>
<text x="24.6" y="507.0" fill="#E4E4E4" textLength="258.0" lengthAdjust="spacingAndGlyphs">  export AGENTBUS_AGENT=worker</text>
<text x="24.6" y="525.0" fill="#E4E4E4" textLength="627.8" lengthAdjust="spacingAndGlyphs">  export AGENTBUS_TOKEN_FILE=&#34;$HOME/.config/agentbus/tokens/worker.token&#34;</text>
<text x="24.6" y="543.0" fill="#E4E4E4" textLength="455.8" lengthAdjust="spacingAndGlyphs">  agentbus handle --capability textstats --exec &#39;CMD&#39;</text>
<text x="24.6" y="561.0" fill="#6C6C6C" textLength="696.6" lengthAdjust="spacingAndGlyphs">  Unset AGENTBUS_URL, AGENTBUS_AGENT and AGENTBUS_TOKEN_FILE afterwards, or later</text>
<text x="24.6" y="579.0" fill="#6C6C6C" textLength="404.2" lengthAdjust="spacingAndGlyphs">  commands in this shell keep acting as worker.</text>
<text x="24.6" y="615.0" fill="#9F86FF" font-weight="bold" textLength="206.4" lengthAdjust="spacingAndGlyphs">Start it on another host</text>
<text x="16.0" y="633.0" fill="#6C6C6C" textLength="258.0" lengthAdjust="spacingAndGlyphs"> lines 1-25 of 38 · ↑/↓ scroll</text>
<text x="24.6" y="651.0" fill="#6C6C6C" textLength="550.4" lengthAdjust="spacingAndGlyphs">↑/↓ scroll · tab switch · y copy · w write worker.env · esc back</text>
</g>
