<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/><stop offset="1" stop-color="#16213a"/>
    </linearGradient>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect width="1920" height="1080" fill="url(#bg)"/>
  <text x="960" y="120" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial" font-weight="700"
        font-size="56" fill="#f8fafc">What we'll build</text>

  <g font-family="Helvetica Neue, Helvetica, Arial">
    <!-- clients -->
    <rect x="120" y="300" width="440" height="160" rx="20" fill="#1e1b4b" stroke="#a78bfa" stroke-width="4"/>
    <text x="340" y="365" text-anchor="middle" font-size="36" font-weight="700" fill="#ede9fe">you, at a terminal</text>
    <text x="340" y="412" text-anchor="middle" font-family="SF Mono, Menlo, monospace" font-size="26" fill="#c4b5fd">agentbus task …</text>

    <rect x="120" y="580" width="440" height="200" rx="20" fill="#1e1b4b" stroke="#a78bfa" stroke-width="4"/>
    <text x="340" y="645" text-anchor="middle" font-size="36" font-weight="700" fill="#ede9fe">Claude Code</text>
    <text x="340" y="692" text-anchor="middle" font-family="SF Mono, Menlo, monospace" font-size="26" fill="#c4b5fd">agentbus mcp</text>
    <text x="340" y="738" text-anchor="middle" font-size="24" fill="#a5b4fc">7 tools: agents, request, task …</text>

    <!-- broker -->
    <rect x="780" y="420" width="360" height="240" rx="24" fill="#0f172a" stroke="#2dd4bf" stroke-width="6"/>
    <text x="960" y="505" text-anchor="middle" font-size="44" font-weight="700" fill="#ccfbf1">broker</text>
    <text x="960" y="555" text-anchor="middle" font-family="SF Mono, Menlo, monospace" font-size="26" fill="#5eead4">agentbus serve</text>
    <text x="960" y="605" text-anchor="middle" font-size="24" fill="#99f6e4">checks every identity</text>

    <!-- weather agent -->
    <rect x="1360" y="380" width="440" height="320" rx="20" fill="#2a1a05" stroke="#f59e0b" stroke-width="4"/>
    <text x="1580" y="445" text-anchor="middle" font-size="36" font-weight="700" fill="#fef3c7">weather agent</text>
    <text x="1580" y="490" text-anchor="middle" font-size="24" fill="#fcd34d">one binary on a host</text>
    <rect x="1400" y="520" width="360" height="66" rx="12" fill="#3b2408" stroke="#b45309" stroke-width="2"/>
    <text x="1580" y="563" text-anchor="middle" font-family="SF Mono, Menlo, monospace" font-size="24" fill="#fde68a">forecast.py</text>
    <rect x="1400" y="606" width="360" height="66" rx="12" fill="#3b2408" stroke="#b45309" stroke-width="2"/>
    <text x="1580" y="649" text-anchor="middle" font-family="SF Mono, Menlo, monospace" font-size="24" fill="#fde68a">current.go</text>

    <!-- weather service -->
    <rect x="1420" y="820" width="320" height="110" rx="16" fill="#111827" stroke="#64748b" stroke-width="3" stroke-dasharray="10 8"/>
    <text x="1580" y="866" text-anchor="middle" font-size="26" fill="#cbd5e1">National Weather</text>
    <text x="1580" y="902" text-anchor="middle" font-size="26" fill="#cbd5e1">Service · Open-Meteo</text>
  </g>
  <g stroke="#94a3b8" stroke-width="4" fill="none">
    <path d="M560 380 C 680 380, 680 500, 780 510" marker-end="url(#a)"/>
    <path d="M560 680 C 680 680, 680 580, 780 570" marker-end="url(#a)"/>
    <path d="M1140 540 L 1360 540" marker-end="url(#a)" marker-start="url(#a)"/>
    <path d="M1580 700 L 1580 820" marker-end="url(#a)"/>
  </g>
  <text x="960" y="1000" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial" font-size="30"
        fill="#94a3b8">To the broker, all three are just agents.</text>
</svg>
