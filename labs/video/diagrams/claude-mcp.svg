<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/><stop offset="1" stop-color="#16213a"/>
    </linearGradient>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect width="1920" height="1080" fill="url(#bg)"/>
  <text x="960" y="120" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial" font-weight="700"
        font-size="56" fill="#f8fafc">Claude Code on the bus</text>

  <g font-family="Helvetica Neue, Helvetica, Arial">
    <rect x="100" y="300" width="420" height="300" rx="22" fill="#1e1b4b" stroke="#a78bfa" stroke-width="4"/>
    <text x="310" y="370" text-anchor="middle" font-size="38" font-weight="700" fill="#ede9fe">Claude Code</text>
    <text x="310" y="425" text-anchor="middle" font-size="26" fill="#c4b5fd">"What's the forecast</text>
    <text x="310" y="462" text-anchor="middle" font-size="26" fill="#c4b5fd">for Seattle, WA?"</text>
    <text x="310" y="545" text-anchor="middle" font-family="SF Mono, Menlo, monospace" font-size="22" fill="#a5b4fc">CLAUDE.md: check agents first</text>

    <rect x="640" y="300" width="380" height="300" rx="22" fill="#0f172a" stroke="#818cf8" stroke-width="4"/>
    <text x="830" y="365" text-anchor="middle" font-family="SF Mono, Menlo, monospace" font-size="32" font-weight="700" fill="#e0e7ff">agentbus mcp</text>
    <text x="830" y="405" text-anchor="middle" font-size="24" fill="#a5b4fc">as agent claude-code</text>
    <g font-family="SF Mono, Menlo, monospace" font-size="24" fill="#c7d2fe">
      <text x="690" y="460">agents  request</text>
      <text x="690" y="500">task    send · emit</text>
      <text x="690" y="540">inbox   reply</text>
    </g>

    <rect x="1140" y="330" width="280" height="240" rx="22" fill="#0f172a" stroke="#2dd4bf" stroke-width="6"/>
    <text x="1280" y="440" text-anchor="middle" font-size="40" font-weight="700" fill="#ccfbf1">broker</text>
    <text x="1280" y="485" text-anchor="middle" font-size="22" fill="#99f6e4">checks claude-code</text>

    <rect x="1540" y="330" width="300" height="240" rx="22" fill="#2a1a05" stroke="#f59e0b" stroke-width="4"/>
    <text x="1690" y="430" text-anchor="middle" font-size="36" font-weight="700" fill="#fef3c7">weather</text>
    <text x="1690" y="475" text-anchor="middle" font-family="SF Mono, Menlo, monospace" font-size="22" fill="#fde68a">weather.forecast</text>
  </g>
  <g stroke="#94a3b8" stroke-width="4" fill="none">
    <path d="M520 450 L 640 450" marker-end="url(#a)" marker-start="url(#a)"/>
    <path d="M1020 450 L 1140 450" marker-end="url(#a)" marker-start="url(#a)"/>
    <path d="M1420 450 L 1540 450" marker-end="url(#a)" marker-start="url(#a)"/>
  </g>
  <text x="580" y="430" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial" font-size="20" fill="#94a3b8">stdio</text>
  <text x="1080" y="430" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial" font-size="20" fill="#94a3b8">MQTT</text>

  <g font-family="Helvetica Neue, Helvetica, Arial" font-size="30">
    <text x="300" y="740" fill="#e2e8f0">1. <tspan font-family="SF Mono, Menlo, monospace" fill="#c4b5fd">agents</tspan>  → finds weather, and its body shape</text>
    <text x="300" y="800" fill="#e2e8f0">2. <tspan font-family="SF Mono, Menlo, monospace" fill="#c4b5fd">task weather.forecast {"location": "Seattle, WA"}</tspan></text>
    <text x="300" y="860" fill="#e2e8f0">3. the reply arrives marked <tspan fill="#fca5a5">untrusted input</tspan>: evidence, not instructions</text>
  </g>
</svg>
